<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>足迹地图</title>
<!--
  桌面端地图页：Key / 安全密钥**由宿主在运行时注入**（window.__AMAP_KEY__ / __AMAP_SEC__），
  本文件不含任何硬编码密钥（红线）。取 Key 顺序：用户自填（设置页，DPAPI 加密）→ 内置回退文件
  Assets/amap_default.json（gitignore，默认不存在）→ 无 Key 则降级为列表视图。
  坐标一律 [lng, lat]，与安卓 / 网页端一致。
  C# → JS：window.render(locs) / window.focusOn(lng,lat) / window.setUser(lng,lat)
            / window.applyPrefs(style, zoom, resetView)
  JS  → C#：window.chrome.webview.postMessage(JSON) —— ready / fail / click / drag / focus
  Key / 安全密钥 / 地图样式 / 默认缩放均由宿主注入（window.__AMAP_KEY__ / __AMAP_SEC__
  / __AMAP_STYLE__ / __AMAP_ZOOM__），本文件不含任何硬编码密钥（红线）。
-->
<!--
  白名单必须覆盖 AMap JS API 2.0 运行时真实用到的全部来源，否则地图会出现
  「只有高德 Logo、主体全白」的假加载状态。实测 2.0 会动态加载：
    · https://webapi.amap.com/...             SDK 引导脚本
    · https://jsapi-service.amap.com/...      渲染器插件（WebGLRenderer，缺失即白屏）
    · https://restapi.amap.com/...            日志 / 服务接口
    · blob: Worker                         矢量瓦片解析线程
  瓦片与静态资源域名含 *.amap.com 与 *.autonavi.com（wprd0x.is.autonavi.com 等）。
  宿主注入 Key 走 AddScriptToExecuteOnDocumentCreated，不受本策略限制。
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob: https://*.amap.com https://*.autonavi.com;
               script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://*.amap.com https://*.autonavi.com;
               worker-src 'self' blob: https://*.amap.com;
               child-src 'self' blob: https://*.amap.com;
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com;
               font-src 'self' data: https://*.amap.com;
               connect-src 'self' data: blob: https://*.amap.com https://*.autonavi.com;">
<style>
  html, body { width:100%; height:100%; margin:0; padding:0;
               font-family:"Microsoft YaHei","Segoe UI",sans-serif; background:#F8F6F2; }
  #container { width:100%; height:100%; background:#F8F6F2; }
  #tip { position:absolute; left:0; right:0; top:0; padding:8px 12px; font-size:12px;
         color:#7A7268; background:rgba(255,255,255,.92); border-bottom:1px solid #E8E2DA; display:none; }
  /* 离线 / SDK 失败时的大块降级面板（桌面端措辞：明确告诉用户去用列表） */
  #offline { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
             background:#F8F6F2; text-align:center; padding:24px; }
  #offline .box { max-width:420px; }
  #offline .t { font-size:16px; font-weight:600; color:#1E1A16; }
  #offline .m { font-size:13px; color:#7A7268; margin-top:10px; line-height:1.7; }
  #offline .b { margin-top:16px; font-size:13px; padding:8px 16px; cursor:pointer;
                border:1px solid #E8E2DA; background:#fff; color:#1E1A16; border-radius:6px; }

  /* ------------------------------------------------------------------
     足迹标记：**纯 CSS 自绘图钉**，不依赖任何外部图片。
     为什么不用高德默认 Marker：默认图钉是远端 png，在 WebView2 的 file:// 源下会加载失败，
     表现为灰色「破图」占位符（曾被用户截图反馈）。自绘后无网络依赖，风格也与应用琥珀主色一致。
     几何：外层 wrap 固定 28×34，rotate(-45°) 的方块把 0 圆角那个角转到底部正中成为针尖，
     针尖落在外层 (14, 33.8) 处 —— 宿主用 offset(-14,-34) 对齐，保证针尖精准压在坐标上。
     ------------------------------------------------------------------ */
  .eo-pin-wrap { position:relative; width:28px; height:34px; }
  .eo-pin { position:absolute; left:0; top:0; width:28px; height:28px; box-sizing:border-box;
            border-radius:50% 50% 50% 0; transform:rotate(-45deg);
            background:linear-gradient(135deg,#EBCFAC 0%,#D4A373 48%,#B57F45 100%);
            border:2px solid #FFFFFF; box-shadow:0 2px 6px rgba(60,42,24,.34);
            cursor:pointer; transition:transform .12s ease, background .12s ease; }
  .eo-pin i { position:absolute; left:50%; top:50%; width:9px; height:9px;
              margin:-4.5px 0 0 -4.5px; border-radius:50%; background:#FFFFFF; }
  .eo-pin-wrap:hover .eo-pin { transform:rotate(-45deg) scale(1.14); }
  .eo-pin.is-active { background:linear-gradient(135deg,#8FBE9B 0%,#4E9C63 52%,#33774A 100%); }
  .eo-label { position:absolute; left:31px; top:5px; white-space:nowrap; max-width:150px;
              overflow:hidden; text-overflow:ellipsis; font-size:11px; line-height:1;
              padding:4px 8px; border-radius:9px; color:#1E1A16; background:rgba(255,255,255,.93);
              border:1px solid #E8E2DA; box-shadow:0 1px 3px rgba(0,0,0,.12); }
</style>
<!-- SDK 不再写死在 HTML 里：等宿主注入 Key 后按 Key 动态加载（见下方 boot） -->
</head>
<body>
<div id="container"></div>
<div id="tip"></div>
<div id="offline">
  <div class="box">
    <div class="t">🗺️ 当前无网络，地图不可用</div>
    <div class="m">
      地图需要联网加载高德地图服务，本次没有加载成功。<br>
      <b>你可以直接切换列表视图</b>：右侧「足迹列表」的新增 / 编辑 / 删除完全可用，不依赖地图。
    </div>
    <button class="b" onclick="location.reload()">🔄 重试加载地图</button>
  </div>
</div>

<script>
  var map = null, markers = {}, userMarker = null, popup = null, lastLocs = [];

  /** 默认视野（全国）与默认样式，供「重置地图视图」使用。 */
  var DEFAULT_CENTER = [105, 35], DEFAULT_ZOOM = 4, DEFAULT_STYLE = 'normal';

  /** 样式关键字 → 高德样式 URI。 */
  function styleUri(name) {
    var s = String(name || '').toLowerCase();
    if (s !== 'normal' && s !== 'whitesmoke' && s !== 'dark') s = DEFAULT_STYLE;
    return 'amap://styles/' + s;
  }

  function post(msg) {
    try {
      if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(JSON.stringify(msg));
    } catch (e) { /* 宿主未监听则忽略 */ }
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function showTip(text) {
    var el = document.getElementById('tip');
    if (!el) return;
    el.textContent = text || '';
    el.style.display = text ? 'block' : 'none';
  }

  /** 统一下线：显示降级面板 + 通知宿主（reason: offline / sdk / init） */
  function fail(reason, detail) {
    var el = document.getElementById('offline');
    if (el) { el.style.display = 'flex'; }
    showTip('');
    post({ type: 'fail', reason: reason, detail: detail || '' });
  }

  /**
   * 启动：读宿主注入的 Key → 注入安全密钥 → 动态加载 SDK → init。
   * 没有 Key 就直接降级（nokey），不发起任何外部请求。
   */
  function boot() {
    var key = window.__AMAP_KEY__ || '';
    var sec = window.__AMAP_SEC__ || '';
    if (!key) {
      fail('nokey', '未配置高德 API Key');
      return;
    }
    // 安全密钥必须在 SDK 加载前注入（AMap 2.0 读取带下划线的 _AMapSecurityConfig）
    if (sec) window._AMapSecurityConfig = { securityJsCode: sec };

    var s = document.createElement('script');
    s.src = 'https://webapi.amap.com/maps?v=2.0&key=' + encodeURIComponent(key);
    s.onload = init;
    s.onerror = function () { fail('sdk', 'script load error'); };
    document.head.appendChild(s);
  }

  function init() {
    // 浏览器层面已明确离线：直接降级，不用等 SDK 超时
    if (window.navigator && window.navigator.onLine === false) {
      fail('offline', 'navigator.onLine=false');
      return;
    }
    if (typeof AMap === 'undefined') {
      fail('sdk', 'AMap undefined');
      return;
    }
    var style = window.__AMAP_STYLE__ || DEFAULT_STYLE;
    var zoom = Number(window.__AMAP_ZOOM__);
    if (!(zoom >= 3 && zoom <= 17)) zoom = DEFAULT_ZOOM;
    // 深色样式下先把容器底色压暗，避免加载瞬间闪一块浅色
    var container = document.getElementById('container');
    if (container && String(style).toLowerCase() === 'dark') container.style.background = '#1B1B1B';

    try {
      map = new AMap.Map('container', {
        zoom: zoom, center: DEFAULT_CENTER, viewMode: '2D', doubleClickZoom: false,
        mapStyle: styleUri(style)
      });
    } catch (e) {
      fail('init', (e && e.message ? e.message : String(e)));
      return;
    }
    post({ type: 'ready' });

    // 点击空白处：把坐标回传宿主，供「+ 添加足迹」预填
    map.on('click', function (e) {
      var lat = e.lnglat.getLat(), lng = e.lnglat.getLng();
      post({ type: 'click', lat: lat, lng: lng });
    });

    // ---- 尺寸同步 ----
    // WebView2 在窗口缩放 / 侧栏折叠时容器尺寸会变，AMap 不会自动跟随，
    // 会出现瓦片错位甚至大片留白。这里显式 map.resize()。
    try {
      if (window.ResizeObserver && container) {
        new ResizeObserver(function () { try { map.resize(); } catch (e) { } }).observe(container);
      }
      window.addEventListener('resize', function () { try { map.resize(); } catch (e) { } });
      // 首帧后补一次（抑制 WebView2 首次布局抖动）
      var n = 0, iv = setInterval(function () {
        try { map.resize(); } catch (e) { }
        if (++n >= 4) clearInterval(iv);
      }, 500);
    } catch (e) { /* 尺寸同步失败不影响地图本身 */ }

    // ---- 白屏看门狗 ----
    // 底图真正画完会触发 'complete'。若 12s 仍未完成，说明渲染链路被拦截（如 CSP 误拦
    // 渲染器插件），此时主动降级，避免用户对着「只有 Logo 的纯白区域」不知所措。
    var basemapDone = false;
    try { map.on('complete', function () { basemapDone = true; window.__MAP_BASEMAP_DONE = true; }); } catch (e) { }
    setTimeout(function () {
      if (!basemapDone) fail('blank', 'basemap not completed in 12s');
    }, 12000);
  }

  /**
   * 单枚足迹标记的自绘 HTML。
   * 针尖精准落在坐标上（offset -14,-34 配合 28×34 的 wrap），名称用悬浮小胶囊显示，
   * 完全没有任何 img / 外部图标依赖，因此不会出现「破图 / 默认图钉 / 拉伸」。
   */
  function markerHtml(l, active) {
    var label = l.name ? '<div class="eo-label">' + esc(l.name) + '</div>' : '';
    return '<div class="eo-pin-wrap"><div class="eo-pin' + (active ? ' is-active' : '') +
           '"><i></i></div>' + label + '</div>';
  }

  /** 渲染足迹标记（全量重画：先清后画，与网页端口径一致） */
  function render(locs) {
    if (!map || typeof AMap === 'undefined') return;
    lastLocs = locs || [];
    for (var k in markers) { try { map.remove(markers[k]); } catch (e) { } }
    markers = {};
    lastLocs.forEach(function (l) {
      var m = new AMap.Marker({
        position: [l.lng, l.lat], map: map, draggable: true, title: l.name,
        content: markerHtml(l), offset: new AMap.Pixel(-14, -34), zIndex: 120
      });
      m.on('click', function () { showPopup(l); post({ type: 'focus', id: l.id }); });
      m.on('dragend', function () {
        var p = m.getPosition();
        post({ type: 'drag', id: l.id, lat: p.getLat(), lng: p.getLng() });
      });
      markers[l.id] = m;
    });
    if (lastLocs.length === 1) { map.setCenter([lastLocs[0].lng, lastLocs[0].lat]); map.setZoom(12); }
    else if (lastLocs.length > 1) {
      // 留出边距，避免标记贴着容器边缘或被标题遮住
      try { map.setFitView(null, false, [70, 70, 70, 70]); } catch (e) { try { map.setFitView(); } catch (e2) { } }
    }
    showTip('');
  }

  function showPopup(l) {
    if (!map || typeof AMap === 'undefined') return;
    // 弹窗抬到针尖之上（图钉高 34px）
    if (!popup) popup = new AMap.InfoWindow({ offset: new AMap.Pixel(0, -38) });
    popup.setContent('<b>' + esc(l.name) + '</b><br>' + esc(l.note || ''));
    popup.open(map, [l.lng, l.lat]);
  }

  /**
   * 设置页改地图偏好后由宿主即时推来（无需重开页面）。
   * @param {string} style  normal / whitesmoke / dark
   * @param {number} zoom   默认缩放级别
   * @param {boolean} reset true = 连视野一起复位（用于「重置地图视图」）
   */
  function applyPrefs(style, zoom, reset) {
    if (!map) return;
    window.__AMAP_STYLE__ = style; window.__AMAP_ZOOM__ = zoom;
    try { map.setMapStyle(styleUri(style)); } catch (e) { }
    var z = Number(zoom); if (!(z >= 3 && z <= 17)) z = DEFAULT_ZOOM;
    if (reset) {
      // 有足迹就重新自适应把它们纳入视野，没有就回到全国默认视野
      if (lastLocs.length) render(lastLocs);
      else { try { map.setZoomAndCenter(z, DEFAULT_CENTER); } catch (e) { } }
      var c = document.getElementById('container');
      if (c) c.style.background = String(style).toLowerCase() === 'dark' ? '#1B1B1B' : '#F8F6F2';
    } else {
      try { map.setZoom(z); } catch (e) { }
    }
  }

  /** 聚焦单个足迹（列表点击 → 地图平移 + 弹窗） */
  function focusOn(lng, lat, name, note) {
    if (!map) return;
    map.setCenter([lng, lat]);
    map.setZoom(12);
    if (name) showPopup({ name: name, note: note });
  }

  /** 用户定位蓝点（纯 CSS，无图片依赖） */
  function setUser(lng, lat) {
    if (!map || typeof AMap === 'undefined') return;
    if (userMarker) { try { userMarker.setPosition([lng, lat]); return; } catch (e) { userMarker = null; } }
    userMarker = new AMap.Marker({
      position: [lng, lat], map: map, anchor: 'center', zIndex: 200,
      content: '<div style="width:14px;height:14px;border-radius:50%;background:#1E90FF;' +
               'border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.35)"></div>'
    });
  }

  window.addEventListener('load', boot);
</script>
</body>
</html>
